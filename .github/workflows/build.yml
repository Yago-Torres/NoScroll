name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen
      - run: xcodegen generate

      # Sin firmar: SideStore firma al instalar.
      - name: Archive
        run: |
          xcodebuild archive \
            -project NoScroll.xcodeproj \
            -scheme NoScroll \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/NoScroll.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Pack ipa
        run: |
          mkdir -p Payload
          cp -R build/NoScroll.xcarchive/Products/Applications/NoScroll.app Payload/
          zip -qry NoScroll.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NoScroll-ipa
          path: NoScroll.ipa

      # Con un tag (git tag v2 && git push --tags) queda una URL directa para SideStore.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release create "$TAG" --title "$TAG" --notes "unsigned ipa" || true
          gh release upload "$TAG" NoScroll.ipa --clobber
