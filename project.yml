name: NoScroll
options:
  bundleIdPrefix: com.yago.noscroll
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Insta:
    type: application
    platform: iOS
    sources: [Shared, Insta]
    info:
      path: Insta/Info.plist
      properties:
        CFBundleDisplayName: Insta
        UILaunchScreen: {}
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
  Tube:
    type: application
    platform: iOS
    sources: [Shared, Tube]
    info:
      path: Tube/Info.plist
      properties:
        CFBundleDisplayName: Tube
        UILaunchScreen: {}
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
